name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fitsnap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/fitsnap_test
      JWT_SECRET: testing-secret-do-not-use-in-prod
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      MOCK_AI: "true"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Setup Prisma
      run: |
        npx prisma generate
        npx prisma migrate deploy

    - name: Run linting
      run: npm run lint
      continue-on-error: true

    - name: Run unit & integration tests
      run: npm run test

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Build Next.js App for E2E
      run: npm run build

    - name: Run E2E Tests
      run: npm run test:e2e
      env:
        PORT: 3000
        PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
